<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - PAYMENT MASERWIN</title>
<style>body{margin:0;background:#07101f;color:#f7fbff;font-family:Arial;padding:18px}.wrap{max-width:900px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.card{margin-top:15px;padding:18px;border:1px solid #ffffff18;border-radius:18px;background:#ffffff09}.meta{color:#91a0b7;font-size:12px;line-height:1.7}.tag{padding:5px 9px;border-radius:20px;background:#1687ff33;font-size:11px}.done{background:#28db9133}button{border:0;border-radius:10px;padding:10px;color:white;font-weight:bold;cursor:pointer;background:#1687ff}button.del{background:#dc365b}button.alt{background:#ffffff16}#login{max-width:360px;margin:15vh auto}.login input{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #fff2;background:#fff1;color:white}.actions{display:flex;gap:8px;margin-top:14px}@media(max-width:500px){.head{align-items:flex-start;gap:10px}}</style></head>
<body><div id="login" class="card login"><h2>Admin PAYMENT MASERWIN</h2><p class="meta">Masukkan password admin.</p><input id="pass" type="password" placeholder="Password"><button onclick="go()">MASUK</button></div>
<div id="app" class="wrap" style="display:none"><div class="head"><div><h1>📥 Laporan Masuk</h1><p class="meta">Bug dan request fitur dari pengguna</p></div><button class="alt" onclick="load()">↻ Refresh</button></div><div id="list"></div></div>
<script>const ADMIN_PASSWORD="maserwin";function go(){if(pass.value!==ADMIN_PASSWORD)return alert("Password salah");login.style.display="none";app.style.display="block";load()}async function load(){const r=await fetch("/api/reports");const a=await r.json();list.innerHTML=a.length?"":`<div class="card">Belum ada laporan.</div>`;a.forEach(x=>{let d=new Date(x.createdAt).toLocaleString("id-ID");list.innerHTML+=`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(x.title)}</b><span class="tag ${x.status==='selesai'?'done':''}">${x.status}</span></div><p>${esc(x.message)}</p><div class="meta">👤 ${esc(x.name)} • ${x.type==='bug'?'Bug':'Request Fitur'}<br>🕒 ${d}</div><div class="actions"><button onclick="toggle('${x.id}')">${x.status==='selesai'?'BUKA LAGI':'TANDAI SELESAI'}</button><button class="del" onclick="del('${x.id}')">HAPUS</button></div></div>`})}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}async function toggle(id){await fetch('/api/reports/'+id,{method:'PATCH'});load()}async function del(id){if(confirm('Hapus laporan ini?')){await fetch('/api/reports/'+id,{method:'DELETE'});load()}}</script></body></html>
